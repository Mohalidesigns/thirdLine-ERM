name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint, guards, build and tests (MariaDB)
    runs-on: ubuntu-latest

    services:
      # MariaDB, not MySQL, and 10.4 to match what developers actually run.
      #
      # The two are not interchangeable where it matters here: MariaDB stores a
      # `json` column as LONGTEXT behind a `json_valid()` CHECK constraint,
      # MySQL 8 has a native JSON type, and they fail differently. Testing on an
      # engine nobody runs is how `connectors.config` — a json column holding
      # ciphertext — passed for months and broke on every real database.
      #
      # `mariadb:10.4` tracks 10.4.x; the machines it is matching are on
      # 10.4.28. NOTE that 10.4 reached end of life in June 2024, so this pin
      # follows the estate rather than endorsing it — when the estate upgrades,
      # this moves with it. The image takes the legacy MYSQL_* variables; the
      # MARIADB_* names arrived after 10.4.
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: risk_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # 8.4, not 8.2. The lock resolves symfony/* v8.1 (php >=8.4.1) and
          # spatie/laravel-permission 7.2.2 (php ^8.3), so `composer install`
          # on 8.2 failed at the install step with "your lock file does not
          # contain a compatible set of packages" — before a single test ran,
          # on every pull request, for as long as those versions have been in
          # the lock. composer.json still advertises "php": "^8.2", which is
          # now untrue of the resolved tree; tightening it is a separate change
          # because it rewrites the lock's content hash.
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, gd, zip, bcmath
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Runs before the test suite: a fabricated figure is a product defect, and
      # it should be the first thing a reviewer sees fail.
      - name: Guard — no RNG in user-facing code
        run: ./scripts/check-no-rng.sh

      - name: Lint — Pint
        run: ./vendor/bin/pint --test

      # The React bundle must build and its entry must land in the manifest.
      #
      # Phase 0 asserted TWO entries here — app.js for Livewire and app.jsx for
      # Inertia. Phase 6.8 deleted app.js with the rest of the Livewire tree and
      # did not update this line, so the check has been asserting the presence
      # of a file the same commit removed. Caught in 7.4 while adding the parity
      # guard below it.
      - name: Build front-end
        run: |
          npm ci
          npm run build
          node -e "const m=require('./public/build/manifest.json'); for (const k of ['resources/js/app.jsx','resources/css/app.css']) { if (!m[k]) { console.error('manifest missing '+k); process.exit(1); } } if (m['resources/js/app.js']) { console.error('resources/js/app.js is back in the manifest; Livewire was removed in Phase 6.8'); process.exit(1); }"

      - name: Guard — migration parity
        run: php scripts/parity-check.php

      # PHPStan and the deprecated-schema audit used to run ONLY on the sqlite
      # leg (`if: matrix.database == 'sqlite'`). Deleting that leg without
      # moving them would have silently deleted two checks along with it.
      #
      # REPORTING, NOT BLOCKING, and that is not a climbdown. Read the header of
      # phpstan-baseline.neon: six errors in WorkflowPresenter,
      # ApprovalController and MyTaskController are "deliberately still red …
      # the programme's known-red marker since Phase 3", kept out of the
      # baseline on purpose, and four of them are cases where "PHPStan IS WRONG,
      # AND OBEYING IT WOULD BREAK THE APP" — nullsafe reads on belongsTo
      # relations whose foreign key is nullable.
      #
      # So the repository holds two decisions that cannot both stand: keep six
      # errors red on purpose, and fail the build on any error. Nobody could
      # have noticed, because CI died at `composer install` four steps before
      # this one ever ran. Blocking here would force somebody to retire the
      # marker in order to merge anything, which is the opposite of what its
      # author intended. The output is still in the log, and the count is still
      # visible; it just no longer gates the pipeline.
      #
      # Retiring the marker properly — fixing the six without deleting the
      # null-safety, the way RcsaReviewService::methodologyIdOf() does — is its
      # own piece of work, and should be a decision rather than a side effect.
      - name: Static analysis — PHPStan (Larastan, level 5, baseline)
        continue-on-error: true
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Tests (MariaDB)
        run: php vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: risk_test
          DB_USERNAME: root
          DB_PASSWORD: root

      # Legacy dual-path tables must not gain new readers during the port
      # (docs/schema/deprecations.md).
      - name: Guard — deprecated schema paths
        run: php artisan schema:audit-deprecated
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: risk_test
          DB_USERNAME: root
          DB_PASSWORD: root
