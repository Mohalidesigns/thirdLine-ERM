<script>
function toggleNav(id) {
    const nav = document.getElementById('nav_' + id);
    const chevron = document.getElementById('chevron_' + id);
    if (nav && chevron) {
        nav.classList.toggle('hidden');
        chevron.classList.toggle('rotate-180');
    }
}
</script>
